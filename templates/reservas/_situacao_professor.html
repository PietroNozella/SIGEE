{% if reserva.etapa == 'ENCERRADA' %}<span class="status-badge reservation-status-encerrada">Encerrada</span>{% elif reserva.etapa == 'EM_USO' %}<span class="status-badge status-em_uso">Em uso</span>{% elif reserva.etapa == 'AGUARDANDO' %}<span class="status-badge reservation-status-ativa">Aguardando retirada</span>{% else %}<span class="status-badge reservation-status-{{ reserva.status|lower }}">{{ reserva.get_status_display }}</span>{% endif %}
