<div class="form-field">
    <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if campo.field.required %} <span class="required-mark" aria-hidden="true">*</span><span class="visually-hidden"> (obrigatório)</span>{% endif %}</label>
    {{ campo }}
    {% if campo.help_text %}<p class="form-help" id="{{ campo.auto_id }}_helptext">{{ campo.help_text }}</p>{% endif %}
    {% if campo.errors %}<div class="field-error" id="{{ campo.auto_id }}_error">{% for erro in campo.errors %}<span>{{ erro }}</span>{% endfor %}</div>{% endif %}
</div>
