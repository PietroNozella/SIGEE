<fieldset class="calendar-time-row" data-time-row>
    <legend>Horário <span data-time-number>{{ forloop.counter|default:"" }}</span></legend>
    {% for oculto in faixa.hidden_fields %}{{ oculto }}{% endfor %}
    <div class="calendar-time-inputs">
        {% include "calendario/_campo.html" with campo=faixa.inicio %}
        {% include "calendario/_campo.html" with campo=faixa.fim %}
        <div class="calendar-delete"><label for="{{ faixa.DELETE.id_for_label }}">{{ faixa.DELETE }} Remover horário</label></div>
        <button class="btn btn-secondary-sigee calendar-remove-time" type="button" data-remove-time hidden>Remover</button>
    </div>
</fieldset>
