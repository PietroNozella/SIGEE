<footer class="inventory-pagination">
    <p>Mostrando {{ pagina.start_index }}–{{ pagina.end_index }} de {{ pagina.paginator.count }} registros</p>
    {% if pagina.paginator.num_pages > 1 %}<nav aria-label="Paginação"><ul class="pagination mb-0">
        <li class="page-item{% if not pagina.has_previous %} disabled{% endif %}">{% if pagina.has_previous %}<a class="page-link" href="?{% if parametros_paginacao %}{{ parametros_paginacao }}&amp;{% endif %}pagina={{ pagina.previous_page_number }}">Anterior</a>{% else %}<span class="page-link" aria-disabled="true">Anterior</span>{% endif %}</li>
        <li class="page-item{% if not pagina.has_next %} disabled{% endif %}">{% if pagina.has_next %}<a class="page-link" href="?{% if parametros_paginacao %}{{ parametros_paginacao }}&amp;{% endif %}pagina={{ pagina.next_page_number }}">Próxima</a>{% else %}<span class="page-link" aria-disabled="true">Próxima</span>{% endif %}</li>
    </ul></nav>{% endif %}
</footer>
